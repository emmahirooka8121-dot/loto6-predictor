# Loto6 Predictor 設定ファイル

# データベース
database:
  path: data/loto6.db

# 分析期間（回数）
analysis_periods:
  - 10
  - 20
  - 50
  - 100
  - all

# 予想生成の重み設定（composite戦略用）
composite_weights:
  frequency: 0.25
  dormancy: 0.20
  correlation: 0.20
  trend: 0.15
  balance: 0.10
  weekday: 0.10

# 各戦略の重み設定
strategy_weights:
  hot:
    frequency: 0.6
    trend: 0.3
    correlation: 0.1
  cold:
    inverse_frequency: 0.7
    dormancy: 0.3
  overdue:
    dormancy: 0.7
    inverse_frequency: 0.3

# スクレイパー設定
scraper:
  user_agent: "Loto6Predictor/1.0 (personal-use)"
  max_retries: 3
  retry_delay: 1
  request_interval: 1

# ログ設定
logging:
  level: INFO
  log_dir: logs

# Webダッシュボード
web:
  port: 8080
  host: "0.0.0.0"

# 自動調整
tuner:
  min_samples: 20
