name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/loto6-ai-predictor-bOD4a
    paths:
      - 'docs/**'
      - 'loto6-predictor.html'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy latest HTML to docs
        run: cp loto6-predictor.html docs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
