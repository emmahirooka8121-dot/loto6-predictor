<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Loto6 Predictor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold">Loto6 Predictor</a>
            <div class="space-x-4">
                <a href="/" class="hover:text-blue-200">ホーム</a>
                <a href="/history" class="hover:text-blue-200">履歴</a>
                <a href="/analysis" class="hover:text-blue-200">分析</a>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="max-w-6xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">
        <p class="bg-yellow-50 border border-yellow-300 rounded p-3">
            &#9888;&#65039; 本アプリはロト6の統計分析に基づく参考値を生成するものです。
            ロト6は完全にランダムな抽選であり、当選を保証するものではありません。
        </p>
    </footer>
</body>
</html>
